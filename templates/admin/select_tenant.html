{% load i18n %}<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="utf-8"><title>{% translate "Selecionar empresa" %}</title></head>
<body>
  <h1 id="select-tenant">{% translate "Selecione uma empresa" %}</h1>
  {% if error %}<p class="errornote">{{ error }}</p>{% endif %}
  <form method="post" action="{% url 'admin-select-tenant' %}">
    {% csrf_token %}
    <select name="tenant">
      {% for tenant in tenants %}<option value="{{ tenant.pk }}">{{ tenant.name }}</option>{% endfor %}
    </select>
    {% if may_break_glass %}
      <p>{% translate "Motivo (obrigatório para acesso fora das suas empresas):" %}</p>
      <input type="text" name="reason" value="">
    {% endif %}
    <input type="hidden" name="next" value="{{ request.GET.next|default:'/admin/' }}">
    <button type="submit">{% translate "Selecionar" %}</button>
  </form>
</body>
</html>
