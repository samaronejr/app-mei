{% extends "base.html" %}{% load i18n %}
{% block title %}{% translate "Aceitar convite" %}{% endblock %}
{% block body %}
  <h1>{% blocktranslate with firm=invite.tenant.name %}Convite para {{ firm }}{% endblocktranslate %}</h1>
  <p>{{ invite.email }}</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">{% translate "Aceitar" %}</button>
  </form>
{% endblock %}
