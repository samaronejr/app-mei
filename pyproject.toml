[project]
name = "app-mei"
version = "0.1.0"
description = "Multi-tenant SaaS for Brazilian accounting firms managing MEI clients"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "celery",
  # T12 (S8.3): client XML is parsed only through defusedxml, with DTDs, entities and
  # external references forbidden (XXE, billion laughs).
  "defusedxml>=0.7.1",
  "django==5.2.*",
  "django-allauth[mfa]",
  "django-celery-beat",
  "django-environ",
  "django-ratelimit",
  # Runtime, not dev: generic subscripts such as `ModelAdmin[Tenant]` appear in shipped
  # code, and Django's classes are not subscriptable at runtime without the monkeypatch
  # this package installs. Dropping it to the dev group breaks production imports only.
  "django-stubs-ext",
  # Production stores document bytes in OCI Object Storage over its S3-compatible API.
  # Development and tests stay on FileSystemStorage, so this is imported only by prod.py
  # -- which means the shipped backend is NOT the tested one, and the storage swap needs
  # its own verify-by-effect step against the real bucket.
  "django-storages[s3]",
  # T12, dependency PROPOSED in the plan: upload type sniffing by magic numbers. Pure
  # Python, no libmagic system package in the image.
  "filetype>=1.2.0",
  "gunicorn",
  # The client import wizard reads XLSX in read-only mode (apps/clients/importing.py).
  "openpyxl>=3.1.5",
  "psycopg[binary]>=3.2",
  # T12: embedded PDF text only (no OCR), 50-page limit and a 10 s budget
  # (apps/cycles/parsing.py).
  "pypdf>=5.0",
  "redis",
  "sentry-sdk[django]",
  # Python 3.13's stdlib uuid has no uuid7() (it lands in 3.14) and Django 5.2 ships no
  # UUIDv7 field. Time-ordered primary keys matter here because every tenant-scoped
  # index leads with tenant_id and a random second column destroys insert locality.
  "uuid6",
  "whitenoise",
]

[dependency-groups]
dev = [
  "boto3-stubs[s3]",
  "aiosmtpd>=1.4.6",
  # Browser + accessibility harness (tests/browser, run with `-m browser`). Pinned
  # exactly: the axe rule set ships inside this package, so an unpinned upgrade can
  # redden or silence an accessibility check without a line of ours changing.
  "axe-playwright-python==0.1.8",
  "django-stubs",
  "hypothesis",
  "jsonschema>=4.26",
  "model-bakery",
  "mypy",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "pytest-django",
  "pytest-playwright==0.9.0",
  "pytest-xdist",
  "ruff",
  "types-defusedxml>=0.7.0.20260504",
  "types-openpyxl>=3.1.5.20260827",
  "types-jsonschema",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["."]
# ruff >=0.14 formats Python code blocks inside Markdown. The plan documents and the
# research report are read-only reference material, so keep ruff scoped to Python.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "CPY001",
  "D203",
  "D213",
  "FBT001",
  "FBT002",
  "FIX002",
  "ISC001",
  "TD002",
  "TD003",
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "tests"]

[tool.ruff.lint.per-file-ignores]
"config/**/*.py" = ["D"]
"tests/**/*.py" = ["ARG", "D", "PLR2004", "S101", "SLF001"]
# Operation subclasses must accept Django's fixed four-argument signature even when a
# direction ignores one state, and _meta.db_table is the documented way to resolve a
# table name from migration state. Neither is lint-dodging; both are the framework API.
"**/migrations/*.py" = ["ARG002", "D", "E501", "RUF012", "N806", "SLF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.mypy]
python_version = "3.13"
strict = true
show_error_codes = true
plugins = ["mypy_django_plugin.main"]
mypy_path = "typings"

[tool.django-stubs]
django_settings_module = "config.settings.test"

[[tool.mypy.overrides]]
module = ["environ"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

# celery ships no py.typed marker, so @shared_task is untyped by construction and
# strict mode's disallow_untyped_decorators would reject every task. Relaxed for task
# modules only — the task bodies themselves stay fully annotated and strictly checked.
[[tool.mypy.overrides]]
module = ["apps.*.tasks", "tests.core.test_tenant_context"]
disallow_untyped_decorators = false
# celery.Task resolves to Any without a py.typed marker, so subclassing it to build
# the tenancy-aware task bases would otherwise be reported as subclassing Any.
disallow_subclassing_any = false

# filetype ships no py.typed marker. It is used in one place, `sniff` in
# apps/cycles/sniffing.py, which reads only `guess(...).mime` and coerces it to str.
[[tool.mypy.overrides]]
module = ["filetype", "filetype.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["allauth", "allauth.*"]
ignore_missing_imports = true

# django-ratelimit ships no py.typed marker. Its one entry point used here,
# is_ratelimited, is wrapped by apps.security.ratelimit.exceeds, which is fully
# annotated and coerces the result to bool — so the untyped surface stops there.
[[tool.mypy.overrides]]
module = ["django_ratelimit", "django_ratelimit.*"]
ignore_missing_imports = true

# axe-playwright-python ships no py.typed marker. It is used in one place, the
# `axe_check` helper in tests/browser/harness.py, which annotates what it reads from
# the result dict -- so the untyped surface ends at that function.
[[tool.mypy.overrides]]
module = ["axe_playwright_python", "axe_playwright_python.*"]
ignore_missing_imports = true

# botocore ships no py.typed marker. Its only use in this codebase is Config, built once
# in prod.py to hand django-storages a client configuration -- so the untyped surface is
# a single constructor call, and every value passed to it is a literal.
[[tool.mypy.overrides]]
module = ["botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
# Browser tests need a Chromium binary (`uv run playwright install chromium`) and are
# deselected here, so a plain `uv run pytest` never requires one; CI runs them in the
# separate `browser` job with `uv run pytest -m browser`, whose `-m` overrides this.
addopts = ["-ra", "--strict-config", "--strict-markers", "-m", "not browser"]
markers = [
  "browser: drives a real Chromium against a live server (tests/browser); deselected by default",
  "scale: exercises the active 1,000-client portfolio envelope; included in CI",
]
filterwarnings = ["error"]
pythonpath = ["."]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "config.settings.test"
