name: Lightsail pilot maintenance

# Manual only, and deliberately not a deployment path. The push deploy in ci.yml is
# the ONLY deployment path; this file exists for the two operator utilities that do
# not belong to a push: recording the environment-scoped OIDC claims, and removing
# stale runner SSH rules a dead runner's `always()` cleanup could not close.
on:
  workflow_dispatch:
    inputs:
      stale_runner_cidrs:
        description: Comma-separated stale runner IPv4 /32s (cleanup only; maximum 8)
        required: false
        type: string

permissions: {}

jobs:
  oidc-claim-probe:
    name: Record the environment-scoped OIDC claims
    runs-on: ubuntu-24.04
    environment: lightsail-pilot
    permissions:
      id-token: write

    steps:
      # The JWT is a credential. Keep it in process memory, decode only segment two,
      # and print only the claims needed to build and audit the IAM trust policy.
      - name: Print the actual OIDC trust-policy claims
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --get \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --data-urlencode 'audience=sts.amazonaws.com' \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          oidc_token="$(jq -er '.value | strings | select(length > 0)' <<<"$response")"
          unset response

          OIDC_TOKEN="$oidc_token" python3 - <<'PY'
          import base64
          import json
          import os

          token = os.environ.pop("OIDC_TOKEN")
          segments = token.split(".")
          if len(segments) != 3:
              raise SystemExit("OIDC response was not a three-segment JWT")

          payload_segment = segments[1]
          payload_segment += "=" * (-len(payload_segment) % 4)
          payload = json.loads(base64.urlsafe_b64decode(payload_segment))

          claim_names = (
              "sub",
              "aud",
              "repository",
              "repository_owner_id",
              "repository_id",
              "environment",
          )
          missing = [name for name in claim_names if name not in payload]
          if missing:
              raise SystemExit(f"OIDC payload omitted required claims: {','.join(missing)}")
          if payload["environment"] != "lightsail-pilot":
              raise SystemExit("OIDC environment claim is not lightsail-pilot")

          for name in claim_names:
              value = payload[name]
              rendered = value if isinstance(value, str) else json.dumps(value, separators=(",", ":"))
              print(f"{name}={rendered}")
          print(f"IAM trust-policy sub (paste exactly): {payload['sub']}")
          PY
          unset oidc_token


  # A dead runner cannot execute its always() cleanup. This manual path is bounded to
  # eight explicitly named IPv4 /32s because Lightsail records no owner or timestamp;
  # guessing which unknown CIDR is stale could remove the operator's only SSH route.
  stale-rule-cleanup:
    name: Remove explicitly identified stale runner SSH rules
    if: inputs.stale_runner_cidrs != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: lightsail-pilot
    permissions:
      id-token: write
    concurrency:
      group: lightsail-pilot-firewall
      cancel-in-progress: false
    env:
      LIGHTSAIL_INSTANCE_NAME: ${{ vars.LIGHTSAIL_INSTANCE_NAME }}
      LIGHTSAIL_PRESERVED_SSH_CIDRS: ${{ vars.LIGHTSAIL_PRESERVED_SSH_CIDRS }}
      REQUESTED_STALE_CIDRS: ${{ inputs.stale_runner_cidrs }}

    steps:
      - name: Refuse an empty or unbounded cleanup request
        run: |
          set -euo pipefail
          if [ -z "$LIGHTSAIL_INSTANCE_NAME" ]; then
            echo "::error::required Lightsail configuration LIGHTSAIL_INSTANCE_NAME is empty"
            exit 1
          fi

          PRESERVED="$LIGHTSAIL_PRESERVED_SSH_CIDRS" \
          REQUESTED="$REQUESTED_STALE_CIDRS" \
          python3 - "$RUNNER_TEMP/lightsail-preserved-ssh-cidrs.txt" \
            "$RUNNER_TEMP/lightsail-stale-runner-cidrs.txt" <<'PY'
          import ipaddress
          import os
          import sys

          def ipv4_32s(raw: str, label: str, *, maximum: int) -> list[str]:
              values = raw.replace(",", " ").split()
              if not values:
                  raise SystemExit(f"{label} must name at least one IPv4 /32")
              if len(values) > maximum:
                  raise SystemExit(f"{label} exceeds the {maximum}-entry bound")
              canonical: list[str] = []
              for value in values:
                  network = ipaddress.ip_network(value, strict=True)
                  if network.version != 4 or network.prefixlen != 32:
                      raise SystemExit(f"{label} entry is not an IPv4 /32: {value}")
                  canonical.append(str(network))
              if len(canonical) != len(set(canonical)):
                  raise SystemExit(f"{label} contains a duplicate CIDR")
              return canonical

          preserved = ipv4_32s(os.environ["PRESERVED"], "preservation list", maximum=8)
          requested = ipv4_32s(os.environ["REQUESTED"], "cleanup request", maximum=8)
          overlap = sorted(set(preserved) & set(requested))
          if overlap:
              raise SystemExit(
                  "cleanup request includes operator-preserved CIDRs: " + ",".join(overlap)
              )

          for path, values in zip(sys.argv[1:], (preserved, requested), strict=True):
              with open(path, "w", encoding="utf-8") as destination:
                  destination.write("\n".join(values) + "\n")
          PY

      - name: Configure short-lived AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_LIGHTSAIL }}
          aws-region: sa-east-1
          audience: sts.amazonaws.com

      # Snapshot and verify the preservation baseline before closing anything. Ports
      # 80/443 and the browser-SSH alias are asserted explicitly, not inferred later.
      - name: Record and validate the current port-22 state
        run: |
          set -euo pipefail
          aws lightsail get-instance-port-states \
            --instance-name "$LIGHTSAIL_INSTANCE_NAME" \
            --output json > "$RUNNER_TEMP/lightsail-cleanup-before.json"

          echo 'Current TCP/22 CIDRs:'
          jq -r '
            .portStates[]
            | select(.protocol == "tcp" and .fromPort == 22 and .toPort == 22)
            | (.cidrs // [])[]
          ' "$RUNNER_TEMP/lightsail-cleanup-before.json"

          while IFS= read -r preserved_cidr; do
            if ! jq -e --arg cidr "$preserved_cidr" '
              any(.portStates[];
                .protocol == "tcp" and .fromPort == 22 and .toPort == 22 and
                .state == "open" and ((.cidrs // []) | index($cidr) != null))
            ' "$RUNNER_TEMP/lightsail-cleanup-before.json" >/dev/null; then
              echo "::error::operator-preserved SSH CIDR $preserved_cidr is absent;" \
                   "cleanup cannot prove the preservation list describes current state"
              exit 1
            fi
          done < "$RUNNER_TEMP/lightsail-preserved-ssh-cidrs.txt"

          if ! jq -e '
            any(.portStates[];
              .protocol == "tcp" and .fromPort == 22 and .toPort == 22 and
              .state == "open" and
              ((.cidrListAliases // []) | index("lightsail-connect") != null))
          ' "$RUNNER_TEMP/lightsail-cleanup-before.json" >/dev/null; then
            echo "::error::Lightsail browser SSH alias lightsail-connect is absent;" \
                 "refusing stale-rule cleanup"
            exit 1
          fi

          for public_port in 80 443; do
            if ! jq -e --argjson port "$public_port" '
              any(.portStates[];
                .protocol == "tcp" and .fromPort == $port and .toPort == $port and
                .state == "open")
            ' "$RUNNER_TEMP/lightsail-cleanup-before.json" >/dev/null; then
              echo "::error::TCP/$public_port is absent from the preservation baseline;" \
                   "refusing stale-rule cleanup"
              exit 1
            fi
          done

      # close-instance-public-ports receives one exact /32 at a time. Never replace the
      # complete port list: doing so can erase the operator /32, browser SSH, and web.
      - name: Close only the requested stale runner CIDRs
        run: |
          set -euo pipefail
          while IFS= read -r stale_cidr; do
            if jq -e --arg cidr "$stale_cidr" '
              any(.portStates[];
                .protocol == "tcp" and .fromPort == 22 and .toPort == 22 and
                .state == "open" and ((.cidrs // []) | index($cidr) != null))
            ' "$RUNNER_TEMP/lightsail-cleanup-before.json" >/dev/null; then
              port_info="$(jq -cn --arg cidr "$stale_cidr" \
                '{fromPort:22,toPort:22,protocol:"tcp",cidrs:[$cidr]}')"
              aws lightsail close-instance-public-ports \
                --instance-name "$LIGHTSAIL_INSTANCE_NAME" \
                --port-info "$port_info" >/dev/null
              echo "requested stale runner CIDR closed: $stale_cidr"
            else
              echo "requested stale runner CIDR already absent: $stale_cidr"
            fi
          done < "$RUNNER_TEMP/lightsail-stale-runner-cidrs.txt"

      - name: Verify requested CIDRs are absent and every other rule is unchanged
        run: |
          set -euo pipefail
          all_absent=0
          for attempt in 1 2 3 4 5 6; do
            aws lightsail get-instance-port-states \
              --instance-name "$LIGHTSAIL_INSTANCE_NAME" \
              --output json > "$RUNNER_TEMP/lightsail-cleanup-after.json"
            all_absent=1
            while IFS= read -r stale_cidr; do
              if jq -e --arg cidr "$stale_cidr" '
                any(.portStates[];
                  .protocol == "tcp" and .fromPort == 22 and .toPort == 22 and
                  .state == "open" and ((.cidrs // []) | index($cidr) != null))
              ' "$RUNNER_TEMP/lightsail-cleanup-after.json" >/dev/null; then
                all_absent=0
              fi
            done < "$RUNNER_TEMP/lightsail-stale-runner-cidrs.txt"
            if [ "$all_absent" -eq 1 ]; then
              break
            fi
            sleep 2
          done
          if [ "$all_absent" -ne 1 ]; then
            echo "::error::one or more requested stale runner CIDRs remain after cleanup"
            exit 1
          fi

          normalize_without_requested() {
            python3 - "$1" "$RUNNER_TEMP/lightsail-stale-runner-cidrs.txt" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              states = json.load(source)["portStates"]
          with open(sys.argv[2], encoding="utf-8") as source:
              requested = {line.strip() for line in source if line.strip()}

          for state in states:
              if (
                  state.get("protocol") == "tcp"
                  and state.get("fromPort") == 22
                  and state.get("toPort") == 22
              ):
                  state["cidrs"] = sorted(
                      cidr for cidr in state.get("cidrs", []) if cidr not in requested
                  )
              state["ipv6Cidrs"] = sorted(state.get("ipv6Cidrs", []))
              state["cidrListAliases"] = sorted(state.get("cidrListAliases", []))

          states.sort(key=lambda state: json.dumps(state, sort_keys=True))
          print(json.dumps(states, sort_keys=True, separators=(",", ":")))
          PY
          }
          if ! diff -u \
            <(normalize_without_requested "$RUNNER_TEMP/lightsail-cleanup-before.json") \
            <(normalize_without_requested "$RUNNER_TEMP/lightsail-cleanup-after.json"); then
            echo "::error::stale-rule cleanup changed firewall state beyond the exact" \
                 "requested TCP/22 /32 entries"
            exit 1
          fi
          echo 'stale runner cleanup verified; protected and non-SSH rules are unchanged'
