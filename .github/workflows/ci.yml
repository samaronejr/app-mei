name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# A superseded push to the same ref is wasted signal, but never cancel main: the
# green run on main is the artifact T-021 exists to produce.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Lint, types, migrations, tests, isolation
    runs-on: ubuntu-24.04
    # A normal run can complete in the low 20-minute range, but this same workflow has exceeded 35 minutes:
    # on merge commit c588669 the job was cancelled at 35m18s after the coverage suite had PASSED and the kill
    # landed during the isolation suite, so the CNPJ regression pack never ran at all. A rerun of that identical
    # commit finished in 22m02s, proving the ceiling sat inside the runner's own variance band; re-running was
    # luck, not a fix. Seventy-five minutes provides runner-variance margin, not permission for indefinite runtime growth:
    # coverage, isolation, RLS, migration, and CNPJ checks all remain mandatory and unconditional.
    timeout-minutes: 75

    # Every credential below is a workflow-local literal for a container that is
    # destroyed when the job ends. Nothing here exists outside this runner, and no
    # real credential may ever be added to this file — production secrets live in
    # the deployment environment (T-022), not in CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app_mei
          POSTGRES_USER: app_mei
          POSTGRES_PASSWORD: ephemeral-ci-superuser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_mei -d app_mei"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # config.settings.base reads a dotenv file when one exists. The runner has no
      # .env, but pointing this at a path that cannot exist makes that explicit
      # rather than incidental — the job is configured by these variables alone.
      DJANGO_ENV_FILE: /nonexistent
      SECRET_KEY: ephemeral-ci-secret-key-not-used-outside-this-runner-0000000000

      APP_MIGRATOR_PASSWORD: ephemeral-ci-app-migrator
      APP_RUNTIME_PASSWORD: ephemeral-ci-app-runtime
      APP_TEST_PASSWORD: ephemeral-ci-app-test

      # Only the roles bootstrap uses the superuser. Nothing else in this job may.
      SUPERUSER_DATABASE_URL: postgres://app_mei:ephemeral-ci-superuser@localhost:5432/app_mei

      DATABASE_URL: postgres://app_runtime:ephemeral-ci-app-runtime@localhost:5432/app_mei
      DATABASE_MIGRATION_URL: postgres://app_migrator:ephemeral-ci-app-migrator@localhost:5432/app_mei
      TEST_DB_USER: app_test
      TEST_DB_PASSWORD: ephemeral-ci-app-test
      CONN_MAX_AGE: "0"

      REDIS_URL: redis://localhost:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,.localhost
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.10.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      # GitHub Actions starts service containers BEFORE the repository is checked
      # out, so the /docker-entrypoint-initdb.d mount that bootstraps roles under
      # local Compose has no equivalent here — the file does not exist when Postgres
      # initialises. Without this step app_runtime, app_migrator and app_test are
      # never created and every step below fails on connect. This is why
      # ops/sql/roles.sql is written idempotent: it now runs two different ways.
      #
      # This step must stay ahead of the first step that touches the database.
      - name: Bootstrap database roles
        run: psql "$SUPERUSER_DATABASE_URL" -v ON_ERROR_STOP=1 -f ops/sql/roles.sql

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Types (mypy)
        run: uv run mypy .

      # The django.core.checks guards never fire under pytest — pytest-django does
      # not call run_checks() — and manage.py defaults to config.settings.dev. Run
      # them once per settings module so ATOMIC_REQUESTS, the host-only cookie rules
      # and the CSRF origin rule are validated in test and prod too, not just dev.
      - name: Django system checks (dev, test, prod settings)
        # The prod iteration selects S3 storage and SMTP; core.E011/core.E013 refuse to
        # boot while either transport is incomplete. These dummies prove configuration
        # SHAPE only. As with every other credential in this file, no real value may
        # ever appear here — production credentials live in the deployment environment.
        #
        # Scoped to this step rather than the job so they never reach the pytest step
        # below, which must exercise the suite's own storage configuration. The dev and
        # test iterations of the loop do see them, harmlessly: those settings modules
        # use FileSystemStorage, and E011 only inspects the S3 backend.
        env:
          OCI_S3_BUCKET: ephemeral-ci-bucket
          OCI_S3_ENDPOINT_URL: https://ci-ephemeral.invalid
          OCI_S3_REGION: ephemeral-ci-region
          OCI_S3_ACCESS_KEY_ID: ephemeral-ci-access-key-id
          OCI_S3_SECRET_ACCESS_KEY: ephemeral-ci-secret-access-key
          EMAIL_HOST: smtp.ci-ephemeral.invalid
          EMAIL_PORT: "587"
          EMAIL_HOST_USER: ephemeral-ci-smtp-user
          EMAIL_HOST_PASSWORD: ephemeral-ci-smtp-password
          EMAIL_USE_TLS: "True"
          EMAIL_USE_SSL: "False"
          EMAIL_TIMEOUT: "10"
          DEFAULT_FROM_EMAIL: nao-responda@ci-ephemeral.invalid
        run: |
          set -euo pipefail
          for module in dev test prod; do
            echo "::group::manage.py check --settings=config.settings.$module"
            uv run python manage.py check --settings="config.settings.$module"
            echo "::endgroup::"
          done

      # Run under test settings: INSTALLED_APPS there is a superset of dev's, so the
      # tenant-scoped fixture app is covered as well as the shipped apps.
      - name: Missing migrations
        run: |
          uv run python manage.py makemigrations --check --dry-run \
            --settings=config.settings.test

      - name: Tests with coverage
        run: |
          uv run pytest \
            --durations=50 \
            --durations-min=1.0 \
            --cov=apps --cov=config \
            --cov-report=term-missing --cov-report=xml

      # Asserted in the job, independently of the suite, because a roles.sql that
      # loses `GRANT app_runtime TO app_test` or drops NOBYPASSRLS makes every
      # cross-tenant denial test pass while reading every tenant's rows.
      #
      # The login role is deliberately NOT what is asserted: config.settings.test
      # connects as app_test, which holds CREATEDB and BYPASSRLS by design, so
      # asserting against session_user would fail correctly-configured infrastructure.
      # What governs policy evaluation is the EFFECTIVE role after SET ROLE.
      - name: Assert effective role cannot bypass RLS
        run: |
          psql "postgres://app_test:${APP_TEST_PASSWORD}@localhost:5432/app_mei" \
            -v ON_ERROR_STOP=1 <<'SQL'
          SET ROLE app_runtime;

          \echo '-- effective role after SET ROLE (this is what RLS is evaluated against)'
          SELECT current_user AS effective_role,
                 session_user AS login_role,
                 (SELECT rolsuper FROM pg_roles WHERE rolname = current_user)
                     AS effective_rolsuper,
                 (SELECT rolbypassrls FROM pg_roles WHERE rolname = current_user)
                     AS effective_rolbypassrls;

          DO $$
          DECLARE
              effective_role text;
              effective_rolsuper boolean;
              effective_rolbypassrls boolean;
          BEGIN
              SELECT current_user,
                     (SELECT rolsuper FROM pg_roles WHERE rolname = current_user),
                     (SELECT rolbypassrls FROM pg_roles WHERE rolname = current_user)
                INTO effective_role, effective_rolsuper, effective_rolbypassrls;

              IF effective_role <> 'app_runtime'
                 OR effective_rolsuper
                 OR effective_rolbypassrls THEN
                  RAISE EXCEPTION
                      'isolation assertions would not bite: effective role is %, '
                      'rolsuper=%, rolbypassrls=% (expected app_runtime/false/false)',
                      effective_role, effective_rolsuper, effective_rolbypassrls;
              END IF;
          END
          $$;
          SQL

      # A dedicated step so an isolation regression is unmistakable in the run log
      # rather than one line inside a 450-test summary. Overlapping with the full
      # run above is deliberate.
      - name: Isolation suite
        run: uv run pytest tests/isolation/ -v

      # A dedicated step for the same reason as the isolation suite above: the CNPJ
      # is this product's most fundamental identifier, alphanumeric registrations
      # went live on 2026-07-31, and a regression that broke either format would
      # otherwise arrive as one line inside a five-hundred-test summary. The pack
      # walks both formats through validation, normalization, model save, queryset
      # filter, admin search, CSV export and re-import, so the step name in a red
      # build already says what class of thing broke.
      - name: CNPJ alfanumerico regression pack
        run: uv run pytest tests/regression/test_cnpj_alfanumerico.py -v

      - name: Upload coverage
        # .evidence/ is deliberately NOT uploaded: it is git-ignored and a plain
        # pytest run does not write it, so the artifact would be empty.
        #
        # Guarded on the file existing, not on always(): when an earlier gate fails
        # pytest never runs, and uploading anyway reported a second, spurious failure
        # that buried the step which actually caught the defect. if-no-files-found
        # stays `error` so a green run producing no report is still loud.
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  container-smoke:
    name: Container smoke (/healthz from inside the stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # No service containers here on purpose: the Compose stack publishes 5432, 6379
    # and 8000 on the runner, which would collide with a job-level service mapping.
    #
    # This job exists because of a real regression: a dependency was added to
    # pyproject.toml and installed into the host virtualenv while the image was
    # never rebuilt, so every host-side gate above stayed green while the running
    # container died with ModuleNotFoundError on every request. Host-side testing
    # provably cannot catch that class of bug — only building the image and asking
    # the running container for a response can.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write workflow-local .env
        # Compose requires SECRET_KEY to be set and reads the rest from .env. These
        # are throwaway values for containers destroyed at job end.
        run: |
          cat > .env <<'ENV'
          SECRET_KEY=ephemeral-ci-secret-key-not-used-outside-this-runner-0000000000
          DEBUG=True
          LOG_LEVEL=INFO
          ALLOWED_HOSTS=localhost,127.0.0.1,.localhost,web
          CSRF_TRUSTED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
          POSTGRES_DB=app_mei
          POSTGRES_USER=app_mei
          POSTGRES_PASSWORD=ephemeral-ci-superuser
          APP_RUNTIME_PASSWORD=ephemeral-ci-app-runtime
          APP_MIGRATOR_PASSWORD=ephemeral-ci-app-migrator
          APP_TEST_PASSWORD=ephemeral-ci-app-test
          CONN_MAX_AGE=60
          ENV

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d --wait

      # Runs inside the built image, so an import that exists only in a developer's
      # host virtualenv fails here.
      - name: Django checks inside the container
        run: docker compose exec -T web python manage.py check

      - name: Assert /healthz returns 200 from inside the container
        run: |
          docker compose exec -T web python - <<'PY'
          import json
          import sys
          import urllib.request

          with urllib.request.urlopen(
              "http://127.0.0.1:8000/healthz", timeout=10
          ) as response:
              status = response.status
              body = response.read().decode()

          print(f"status={status} body={body}")
          if status != 200:
              sys.exit(f"expected HTTP 200 from /healthz, got {status}")

          payload = json.loads(body)
          if payload.get("status") != "ok":
              sys.exit(f"unexpected /healthz body: {body!r}")

          # The probe also carries the beat dead-man's switch (T-041): it answers 503
          # once the newest SchedulerHeartbeat passes fifteen minutes. Asserting
          # "alive" here makes this job prove something the host-side suite cannot —
          # that a COLD-BOOTED stack arms the switch, because the row is seeded by a
          # migration rather than by beat's first tick. Without the seed this is
          # exactly where a fresh deployment would sit at 503 until beat caught up.
          if payload.get("scheduler") != "alive":
              sys.exit(f"scheduler is not alive in a cold-booted stack: {body!r}")
          PY

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

  deploy-pilot:
    name: Deploy to the pilot host (main only, after the gates above)
    runs-on: ubuntu-24.04
    needs: [test, container-smoke]
    # Both halves are load-bearing. `push` excludes pull_request runs, whose head is a
    # synthetic merge commit that exists on no branch and therefore cannot be checked
    # out on the box. The ref check excludes any branch a future trigger might add.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 60

    # The environment is what scopes the OIDC token's `environment` claim and gates
    # access to the _LIGHTSAIL secrets; the IAM trust policy accepts nothing else.
    environment: lightsail-pilot
    permissions:
      id-token: write
      contents: read

    # Never cancel a deploy in flight: a half-loaded image or a stack caught mid-`up`
    # is a worse state than a queue, and a cancelled job may skip the `if: always()`
    # firewall cleanup below, stranding the runner's SSH rule open. The group is
    # shared with the stale-rule cleanup in deploy-lightsail.yml so the two can never
    # mutate the same firewall concurrently. GitHub retains only the NEWEST pending
    # run per group, so back-to-back pushes supersede one another and the superseded
    # deploy reports `cancelled` — by design. Anything asserting on deploy history
    # must therefore read the latest COMPLETED run, not the latest run.
    concurrency:
      group: lightsail-pilot-firewall
      cancel-in-progress: false

    env:
      DEPLOY_HOST_LIGHTSAIL: ${{ secrets.DEPLOY_HOST_LIGHTSAIL }}
      DEPLOY_USER_LIGHTSAIL: ${{ secrets.DEPLOY_USER_LIGHTSAIL }}
      DEPLOY_PATH_LIGHTSAIL: ${{ secrets.DEPLOY_PATH_LIGHTSAIL }}
      LIGHTSAIL_INSTANCE_NAME: ${{ vars.LIGHTSAIL_INSTANCE_NAME }}
      LIGHTSAIL_PRESERVED_SSH_CIDRS: ${{ vars.LIGHTSAIL_PRESERVED_SSH_CIDRS }}
      GIT_SHA: ${{ github.sha }}
      COMPOSE: docker compose --env-file .env.prod -f docker-compose.prod.yml
      HEALTHZ_URL: https://samaronefialho.dev/healthz
      READYZ_URL: https://samaronefialho.dev/readyz
      VERSIONZ_URL: https://samaronefialho.dev/versionz
      # 3 GiB. The pair is ~1.16 GB (app 1.01 GB, caddy 154 MB) and the previous
      # generation stays resident until the prune at the very end, so the load needs
      # room for both plus the decompressed stream.
      MIN_FREE_KIB: "3145728"
      # 1.5 GiB is deliberate: two images are decompressed and loaded concurrently
      # beside a running stack. The observed failure is a stalled `docker load` over
      # SSH, not a clean OOM, so these floors fail fast and legibly instead of hanging
      # for 24 minutes while the box cannot make progress.
      MIN_MEM_AVAILABLE_KIB: "1572864"
      MIN_SWAP_FREE_KIB: "1048576"

    steps:
      - name: Refuse incomplete Lightsail configuration
        env:
          DEPLOY_SSH_KEY_LIGHTSAIL: ${{ secrets.DEPLOY_SSH_KEY_LIGHTSAIL }}
          DEPLOY_KNOWN_HOSTS_LIGHTSAIL: ${{ secrets.DEPLOY_KNOWN_HOSTS_LIGHTSAIL }}
          AWS_ROLE_ARN_LIGHTSAIL: ${{ vars.AWS_ROLE_ARN_LIGHTSAIL }}
        run: |
          set -euo pipefail
          for name in \
            DEPLOY_HOST_LIGHTSAIL \
            DEPLOY_USER_LIGHTSAIL \
            DEPLOY_PATH_LIGHTSAIL \
            DEPLOY_SSH_KEY_LIGHTSAIL \
            DEPLOY_KNOWN_HOSTS_LIGHTSAIL \
            AWS_ROLE_ARN_LIGHTSAIL \
            LIGHTSAIL_INSTANCE_NAME \
            LIGHTSAIL_PRESERVED_SSH_CIDRS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::required Lightsail configuration $name is empty"
              exit 1
            fi
          done

      # The deploy target is the pushed commit itself: GIT_SHA is github.sha, so the
      # checkout, the image build, the Sync and the release assertions all name the
      # same commit by construction.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # PLAIN `docker build`, never Compose: the production file has mandatory
      # interpolation whose values exist only in .env.prod on the target.
      - name: Build both images
        run: |
          set -euo pipefail
          docker build --build-arg GIT_SHA="$GIT_SHA" -t app-mei:prod .
          docker build -t app-mei-caddy:prod ops/caddy
          docker image ls --filter reference='app-mei*:prod' \
            --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      - name: Configure short-lived AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_LIGHTSAIL }}
          aws-region: sa-east-1
          audience: sts.amazonaws.com

      # Read the whole firewall state before mutation. The preservation variable is an
      # explicit operator-owned allow-list: inference is unsafe because an arbitrary
      # /32 and a stale runner /32 are indistinguishable in the Lightsail API.
      - name: Open only the runner SSH rule
        run: |
          set -euo pipefail
          runner_ip="$(curl -fsS --connect-timeout 10 --max-time 30 \
            --retry 4 --retry-all-errors https://checkip.amazonaws.com \
            | tr -d '[:space:]')"
          runner_cidr="$(python3 - "$runner_ip" <<'PY'
          import ipaddress
          import sys

          address = ipaddress.ip_address(sys.argv[1])
          if address.version != 4:
              raise SystemExit("runner address is not IPv4")
          print(f"{address}/32")
          PY
          )"

          PRESERVED="$LIGHTSAIL_PRESERVED_SSH_CIDRS" \
          python3 - > "$RUNNER_TEMP/lightsail-preserved-ssh-cidrs.txt" <<'PY'
          import ipaddress
          import os

          values = os.environ["PRESERVED"].replace(",", " ").split()
          if not values:
              raise SystemExit("LIGHTSAIL_PRESERVED_SSH_CIDRS must name the operator /32")
          if len(values) > 8:
              raise SystemExit("LIGHTSAIL_PRESERVED_SSH_CIDRS exceeds the 8-entry bound")
          for value in values:
              network = ipaddress.ip_network(value, strict=True)
              if network.version != 4 or network.prefixlen != 32:
                  raise SystemExit(f"preserved SSH entry is not an IPv4 /32: {value}")
              print(network)
          PY

          if grep -Fxq "$runner_cidr" "$RUNNER_TEMP/lightsail-preserved-ssh-cidrs.txt"; then
            echo "::error::runner CIDR $runner_cidr is operator-preserved; refusing to" \
                 "claim and later remove an operator SSH rule"
            exit 1
          fi

          aws lightsail get-instance-port-states \
            --instance-name "$LIGHTSAIL_INSTANCE_NAME" \
            --output json > "$RUNNER_TEMP/lightsail-ports-before.json"

          while IFS= read -r preserved_cidr; do
            if ! jq -e --arg cidr "$preserved_cidr" '
              any(.portStates[];
                .protocol == "tcp" and .fromPort == 22 and .toPort == 22 and
                .state == "open" and ((.cidrs // []) | index($cidr) != null))
            ' "$RUNNER_TEMP/lightsail-ports-before.json" >/dev/null; then
              echo "::error::explicitly preserved operator SSH CIDR $preserved_cidr" \
                   "is absent from the current Lightsail port-22 state"
              exit 1
            fi
          done < "$RUNNER_TEMP/lightsail-preserved-ssh-cidrs.txt"

          if ! jq -e '
            any(.portStates[];
              .protocol == "tcp" and .fromPort == 22 and .toPort == 22 and
              .state == "open" and
              ((.cidrListAliases // []) | index("lightsail-connect") != null))
          ' "$RUNNER_TEMP/lightsail-ports-before.json" >/dev/null; then
            echo "::error::Lightsail browser SSH alias lightsail-connect is absent;" \
                 "refusing a mutation whose preservation baseline is incomplete"
            exit 1
          fi

          for public_port in 80 443; do
            if ! jq -e --argjson port "$public_port" '
              any(.portStates[];
                .protocol == "tcp" and .fromPort == $port and .toPort == $port and
                .state == "open")
            ' "$RUNNER_TEMP/lightsail-ports-before.json" >/dev/null; then
              echo "::error::TCP/$public_port is not open in the baseline; refusing a" \
                   "firewall mutation that cannot prove HTTP/HTTPS preservation"
              exit 1
            fi
          done

          lightsail_ip="$(aws lightsail get-instance \
            --instance-name "$LIGHTSAIL_INSTANCE_NAME" \
            --query 'instance.publicIpAddress' --output text)"
          python3 - "$lightsail_ip" <<'PY'
          import ipaddress
          import sys

          address = ipaddress.ip_address(sys.argv[1])
          if address.version != 4:
              raise SystemExit("Lightsail public address is not IPv4")
          PY

          printf 'RUNNER_CIDR=%s\n' "$runner_cidr" >> "$GITHUB_ENV"
          printf 'LIGHTSAIL_IP=%s\n' "$lightsail_ip" >> "$GITHUB_ENV"

          port_info="$(jq -cn --arg cidr "$runner_cidr" \
            '{fromPort:22,toPort:22,protocol:"tcp",cidrs:[$cidr]}')"
          aws lightsail open-instance-public-ports \
            --instance-name "$LIGHTSAIL_INSTANCE_NAME" \
            --port-info "$port_info" >/dev/null

      - name: Verify the runner rule exists and nothing else changed
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            aws lightsail get-instance-port-states \
              --instance-name "$LIGHTSAIL_INSTANCE_NAME" \
              --output json > "$RUNNER_TEMP/lightsail-ports-open.json"
            if jq -e --arg cidr "$RUNNER_CIDR" '
              any(.portStates[];
                .protocol == "tcp" and .fromPort == 22 and .toPort == 22 and
                .state == "open" and ((.cidrs // []) | index($cidr) != null))
            ' "$RUNNER_TEMP/lightsail-ports-open.json" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::runner SSH rule $RUNNER_CIDR was not observable after open"
              exit 1
            fi
            sleep 2
          done

          normalize_without_runner() {
            jq -S --arg cidr "$RUNNER_CIDR" '
              .portStates
              | map(
                  if .protocol == "tcp" and .fromPort == 22 and .toPort == 22 then
                    .cidrs = ((.cidrs // []) | map(select(. != $cidr)) | sort)
                  else . end
                  | .ipv6Cidrs = ((.ipv6Cidrs // []) | sort)
                  | .cidrListAliases = ((.cidrListAliases // []) | sort)
                )
              | sort_by(.protocol, .fromPort, .toPort, .state)
            ' "$1"
          }
          if ! diff -u \
            <(normalize_without_runner "$RUNNER_TEMP/lightsail-ports-before.json") \
            <(normalize_without_runner "$RUNNER_TEMP/lightsail-ports-open.json"); then
            echo "::error::opening $RUNNER_CIDR changed firewall state beyond that exact" \
                 "TCP/22 CIDR; operator SSH, browser SSH, HTTP, and HTTPS must survive"
            exit 1
          fi

      - name: Open an authenticated channel to Lightsail
        env:
          DEPLOY_SSH_KEY_LIGHTSAIL: ${{ secrets.DEPLOY_SSH_KEY_LIGHTSAIL }}
          DEPLOY_KNOWN_HOSTS_LIGHTSAIL: ${{ secrets.DEPLOY_KNOWN_HOSTS_LIGHTSAIL }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY_LIGHTSAIL" > "$RUNNER_TEMP/ssh/id_deploy"
          chmod 600 "$RUNNER_TEMP/ssh/id_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS_LIGHTSAIL" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"

          cat > "$RUNNER_TEMP/ssh/dssh" <<'WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          exec ssh \
            -i "$RUNNER_TEMP/ssh/id_deploy" \
            -o IdentitiesOnly=yes \
            -o IdentityAgent=none \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER_LIGHTSAIL@$DEPLOY_HOST_LIGHTSAIL" "$@"
          WRAPPER
          chmod 700 "$RUNNER_TEMP/ssh/dssh"

          resolved_host_ip="$(getent ahostsv4 "$DEPLOY_HOST_LIGHTSAIL" \
            | awk 'NR==1{print $1}')"
          if [ "$resolved_host_ip" != "$LIGHTSAIL_IP" ]; then
            echo "::error::DEPLOY_HOST_LIGHTSAIL resolves to $resolved_host_ip, but the" \
                 "Lightsail control plane reports $LIGHTSAIL_IP"
            exit 1
          fi
          "$RUNNER_TEMP/ssh/dssh" 'echo "channel open on $(hostname)"'

      # Sync is the reversible half and therefore precedes image transfer. The target
      # checkout is not evidence of the running release; assertions below inspect both.
      #
      # GIT_SHA is the head of the push that triggered this run, so `fetch --prune
      # origin` always reaches it: the commit is on origin/main by definition.
      - name: Sync the Lightsail checkout to this commit
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ssh/dssh" "
            set -eu
            export GIT_TERMINAL_PROMPT=0
            git -C '$DEPLOY_PATH_LIGHTSAIL' fetch --prune origin
            git -C '$DEPLOY_PATH_LIGHTSAIL' reset --hard '$GIT_SHA'
            test \"\$(git -C '$DEPLOY_PATH_LIGHTSAIL' rev-parse HEAD)\" = '$GIT_SHA'
          "

      # Runs against the just-synced checkout, so the audit is the version this commit
      # ships rather than whatever happened to be on the box. It prints key NAMES only
      # on failure — never values — which is what makes it safe to run in a CI log.
      - name: Audit .env.prod for leftover placeholders
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ssh/dssh" "cd '$DEPLOY_PATH_LIGHTSAIL' && python3 ops/check_env_prod.py .env.prod .env.prod.example"

      - name: Disk capacity preflight on Lightsail
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ssh/dssh" 'df -h /var/lib/docker; echo; docker system df'
          free_disk_kib="$("$RUNNER_TEMP/ssh/dssh" \
            'df -Pk /var/lib/docker | tail -n1 | tr -s " " | cut -d" " -f4')"
          if [ "$free_disk_kib" -lt "$MIN_FREE_KIB" ]; then
            echo "::error::disk floor unmet: measured ${free_disk_kib} KiB free under" \
                 "/var/lib/docker; floor ${MIN_FREE_KIB} KiB required to land the" \
                 "pair beside the running one"
            exit 1
          fi
          echo "disk preflight ok: ${free_disk_kib} KiB free (floor ${MIN_FREE_KIB})"

      - name: Memory capacity preflight on Lightsail
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ssh/dssh" \
            'grep -E "^(MemAvailable|SwapFree):" /proc/meminfo'
          mem_available_kib="$("$RUNNER_TEMP/ssh/dssh" \
            'awk "/^MemAvailable:/ {print \$2}" /proc/meminfo')"
          swap_free_kib="$("$RUNNER_TEMP/ssh/dssh" \
            'awk "/^SwapFree:/ {print \$2}" /proc/meminfo')"

          resource_failure=0
          if ! [[ "$mem_available_kib" =~ ^[0-9]+$ ]] \
             || [ "$mem_available_kib" -lt "$MIN_MEM_AVAILABLE_KIB" ]; then
            echo "::error::MemAvailable floor unmet: measured ${mem_available_kib:-unreadable}" \
                 "KiB; floor ${MIN_MEM_AVAILABLE_KIB} KiB required, or docker load can" \
                 "stall over SSH beside the running stack"
            resource_failure=1
          fi
          if ! [[ "$swap_free_kib" =~ ^[0-9]+$ ]] \
             || [ "$swap_free_kib" -lt "$MIN_SWAP_FREE_KIB" ]; then
            echo "::error::SwapFree floor unmet: measured ${swap_free_kib:-unreadable}" \
                 "KiB; floor ${MIN_SWAP_FREE_KIB} KiB required, or docker load can" \
                 "stall over SSH beside the running stack"
            resource_failure=1
          fi
          exit "$resource_failure"

      # Both tags are anchored before docker load overwrites :prod. The first deploy to
      # this host has no prior generation, so each missing source tag is an allowed
      # no-op.
      - name: Anchor rollback by tagging both current images previous
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ssh/dssh" '
            set -eu
            docker tag app-mei:prod app-mei:previous || true
            docker tag app-mei-caddy:prod app-mei-caddy:previous || true
            docker image ls --filter reference="app-mei*:previous" \
              --format "{{.Repository}}:{{.Tag}} {{.ID}}"
          '

      # `set -euo pipefail` on the REMOTE side too, not only on the runner. The runner's
      # own pipefail covers `docker save | gzip | ssh`, but everything after that ssh is
      # a second, separate shell — and without pipefail it reports only `docker load`'s
      # status. A gunzip that dies on a truncated or corrupt stream is then invisible,
      # `docker load` can exit 0 having loaded a stale or partial set of layers, and the
      # step goes green while :prod is not the image that was built. Same
      # last-command-wins trap that docker-compose.prod.yml's archive_command documents.
      - name: Ship both images to Lightsail
        run: |
          set -euo pipefail
          docker save app-mei:prod app-mei-caddy:prod \
            | gzip -1 \
            | "$RUNNER_TEMP/ssh/dssh" 'set -euo pipefail; gunzip | docker load'

      # Until the DNS flip the public name still resolves to OCI, so this stack is a
      # shadow of the live edge. Lightsail's ACME_DNS_OPTION/CF_API_TOKEN drive DNS-01
      # so it can hold a public certificate before cutover; two hosts issuing for the
      # same domain can race on the shared _acme-challenge TXT record, so do not run
      # OCI and Lightsail issuance concurrently.
      - name: Roll the shadow stack onto the new images
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ssh/dssh" "
            set -eu
            cd '$DEPLOY_PATH_LIGHTSAIL'
            $COMPOSE up -d --no-build --wait
          "

      - name: 'Assert 1/6 — the running container is this commit'
        run: |
          set -euo pipefail
          release="$("$RUNNER_TEMP/ssh/dssh" \
            "cd '$DEPLOY_PATH_LIGHTSAIL' && $COMPOSE exec -T web cat /app/RELEASE" \
            | tr -d '[:space:]')"
          if [ "$release" != "$GIT_SHA" ]; then
            echo "::error::/app/RELEASE reads '$release' but this run deploys" \
                 "'$GIT_SHA' — Lightsail did not take the pushed image"
            exit 1
          fi
          echo "assert 1/6 ok: /app/RELEASE == $GIT_SHA"

      # Capture and positive-control the probe before asking whether anything is
      # pending. An empty plan from a dead container would otherwise pass vacuously.
      - name: 'Assert 2/6 — migrations applied, probe positive-controlled'
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/migration-plan.txt"
          rc=0
          "$RUNNER_TEMP/ssh/dssh" \
            "cd '$DEPLOY_PATH_LIGHTSAIL' && $COMPOSE exec -T web sh -c 'DATABASE_URL=\"\$DATABASE_MIGRATION_URL\" python manage.py showmigrations --plan --skip-checks'" \
            > "$plan" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::showmigrations exited $rc — the probe itself failed, so its" \
                 "output proves nothing about migration state"
            cat "$plan" || true
            exit 1
          fi
          applied="$(grep -c '\[X\]' "$plan" || true)"
          if [ "$applied" -lt 1 ]; then
            echo "::error::positive control failed: zero applied migrations in a" \
                 "$(wc -l < "$plan")-line plan, so 'no pending' would be vacuous"
            cat "$plan"
            exit 1
          fi
          if grep -q '\[ \]' "$plan"; then
            echo "::error::migrations are pending on Lightsail:"
            grep -n '\[ \]' "$plan"
            exit 1
          fi
          echo "assert 2/6 ok: $applied migrations applied, none pending"

      - name: 'Assert 3/6 — Django system checks green in the deployed container'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ssh/dssh" \
            "cd '$DEPLOY_PATH_LIGHTSAIL' && $COMPOSE exec -T web python manage.py check"
          echo "assert 3/6 ok: manage.py check clean"

      # Every public assertion goes through the Lightsail address while ordinary DNS
      # still resolves to OCI. Dropping --resolve would test the rollback target instead.
      - name: 'Assert 4/6 — /healthz is ok over the Lightsail public edge'
        run: |
          set -euo pipefail
          healthz_url="${HEALTHZ_URL}?cb=${GITHUB_RUN_ID}"
          body=''
          for attempt in 1 2 3; do
            if body="$(curl -fsS --connect-timeout 10 --max-time 30 \
              --resolve "samaronefialho.dev:443:$LIGHTSAIL_IP" \
              "$healthz_url")"; then
              break
            fi
            body=''
            echo "healthz attempt ${attempt}/3 did not answer; retrying in 10s"
            sleep 10
          done
          if [ -z "$body" ]; then
            echo "::error::$healthz_url never answered across 3 attempts"
            exit 1
          fi
          printf '%s\n' "$body"
          if ! jq -e '.status == "ok"' <<<"$body" >/dev/null; then
            echo "::error::$healthz_url answered from $LIGHTSAIL_IP without status ok"
            exit 1
          fi
          echo "assert 4/6 ok: $healthz_url reports status ok on $LIGHTSAIL_IP"

      - name: 'Assert 5/6 — /readyz reports database and Redis ready'
        run: |
          set -euo pipefail
          body="$(curl -fsS --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-all-errors \
            --resolve "samaronefialho.dev:443:$LIGHTSAIL_IP" \
            "${READYZ_URL}?cb=${GITHUB_RUN_ID}")"
          printf '%s\n' "$body"
          if ! jq -e '
            .status == "ready" and
            .database == "ok" and
            .redis == "ok"
          ' <<<"$body" >/dev/null; then
            echo "::error::/readyz on $LIGHTSAIL_IP did not report ready/ok/ok"
            exit 1
          fi
          echo "assert 5/6 ok: /readyz dependencies are ready on $LIGHTSAIL_IP"

      - name: 'Assert 6/6 — the Lightsail public edge runs this commit'
        run: |
          set -euo pipefail
          body="$(curl -fsS --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-all-errors \
            --resolve "samaronefialho.dev:443:$LIGHTSAIL_IP" \
            "${VERSIONZ_URL}?cb=${GITHUB_RUN_ID}")"
          printf '%s\n' "$body"
          if ! jq -e --arg GIT_SHA "$GIT_SHA" '.release == $GIT_SHA' \
            <<<"$body" >/dev/null; then
            echo "::error::/versionz on $LIGHTSAIL_IP does not report $GIT_SHA"
            exit 1
          fi
          echo "assert 6/6 ok: public /versionz on $LIGHTSAIL_IP == $GIT_SHA"

      # The command owns a disjoint _probe/ key, authenticates readback, deletes it,
      # confirms absence, and repeats deletion in finally. It never touches customer
      # objects or bucket policy, and no broader storage operation is approved here.
      - name: Verify private object storage within the approved probe namespace
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ssh/dssh" \
            "cd '$DEPLOY_PATH_LIGHTSAIL' && $COMPOSE exec -T web python manage.py storage_probe"

      # Last: the previous tags are the rollback anchor until every assertion passes.
      - name: Reclaim orphaned layers
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ssh/dssh" 'docker image prune -f; df -h /var/lib/docker'

      - name: Capture Lightsail stack state on failure
        if: failure() && env.RUNNER_CIDR != ''
        run: |
          "$RUNNER_TEMP/ssh/dssh" \
            "cd '$DEPLOY_PATH_LIGHTSAIL' && $COMPOSE ps" || true
          "$RUNNER_TEMP/ssh/dssh" \
            "cd '$DEPLOY_PATH_LIGHTSAIL' && $COMPOSE logs --tail=100 --no-log-prefix web" || true

      # This step owns exactly RUNNER_CIDR. It never sends the rest of the port-22
      # cidrs, the lightsail-connect alias, or ports 80/443 back through a replacing API.
      - name: Close only the runner SSH rule
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${RUNNER_CIDR:-}" ]; then
            echo 'runner CIDR was never allocated; no JIT SSH rule can require cleanup'
            exit 0
          fi
          aws lightsail get-instance-port-states \
            --instance-name "$LIGHTSAIL_INSTANCE_NAME" \
            --output json > "$RUNNER_TEMP/lightsail-ports-before-close.json"
          if jq -e --arg cidr "$RUNNER_CIDR" '
            any(.portStates[];
              .protocol == "tcp" and .fromPort == 22 and .toPort == 22 and
              .state == "open" and ((.cidrs // []) | index($cidr) != null))
          ' "$RUNNER_TEMP/lightsail-ports-before-close.json" >/dev/null; then
            port_info="$(jq -cn --arg cidr "$RUNNER_CIDR" \
              '{fromPort:22,toPort:22,protocol:"tcp",cidrs:[$cidr]}')"
            aws lightsail close-instance-public-ports \
              --instance-name "$LIGHTSAIL_INSTANCE_NAME" \
              --port-info "$port_info" >/dev/null
          fi

      - name: Verify the runner SSH rule is absent and all baseline rules remain
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${RUNNER_CIDR:-}" ]; then
            echo 'runner CIDR was never allocated; absence verification is not applicable'
            exit 0
          fi
          for attempt in 1 2 3 4 5 6; do
            aws lightsail get-instance-port-states \
              --instance-name "$LIGHTSAIL_INSTANCE_NAME" \
              --output json > "$RUNNER_TEMP/lightsail-ports-after-close.json"
            if ! jq -e --arg cidr "$RUNNER_CIDR" '
              any(.portStates[];
                .protocol == "tcp" and .fromPort == 22 and .toPort == 22 and
                .state == "open" and ((.cidrs // []) | index($cidr) != null))
            ' "$RUNNER_TEMP/lightsail-ports-after-close.json" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::runner SSH rule $RUNNER_CIDR remains after close"
              exit 1
            fi
            sleep 2
          done

          normalize_without_runner() {
            jq -S --arg cidr "$RUNNER_CIDR" '
              .portStates
              | map(
                  if .protocol == "tcp" and .fromPort == 22 and .toPort == 22 then
                    .cidrs = ((.cidrs // []) | map(select(. != $cidr)) | sort)
                  else . end
                  | .ipv6Cidrs = ((.ipv6Cidrs // []) | sort)
                  | .cidrListAliases = ((.cidrListAliases // []) | sort)
                )
              | sort_by(.protocol, .fromPort, .toPort, .state)
            ' "$1"
          }
          if ! diff -u \
            <(normalize_without_runner "$RUNNER_TEMP/lightsail-ports-before.json") \
            <(normalize_without_runner "$RUNNER_TEMP/lightsail-ports-after-close.json"); then
            echo "::error::firewall state after cleanup differs from the pre-deploy" \
                 "baseline beyond $RUNNER_CIDR"
            exit 1
          fi
          echo "firewall cleanup verified: $RUNNER_CIDR absent; baseline preserved"

      - name: Shred the Lightsail key material
        if: always()
        run: |
          shred -u "$RUNNER_TEMP/ssh/id_deploy" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/ssh/dssh" "$RUNNER_TEMP/ssh/known_hosts"
