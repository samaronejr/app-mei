x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: config.settings.dev
  # The host .env is bind-mounted into /app but describes host-side URLs. Point the
  # env-file reader at a path that does not exist so container configuration comes
  # only from the explicit values below.
  DJANGO_ENV_FILE: /nonexistent
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set — run "cp .env.example .env" first}
  DEBUG: ${DEBUG:-True}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,.localhost,web}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
  DATABASE_URL: postgres://${POSTGRES_USER:-app_mei}:${POSTGRES_PASSWORD:-app_mei_password}@db:5432/${POSTGRES_DB:-app_mei}
  CONN_MAX_AGE: ${CONN_MAX_AGE:-60}
  REDIS_URL: redis://redis:6379/0

x-app-service: &app-service
  build:
    context: .
  image: app-mei:dev
  environment: *app-environment
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_mei}
      POSTGRES_USER: ${POSTGRES_USER:-app_mei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_mei_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bound to the loopback interface: the database is never reachable from the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  web:
    <<: *app-service
    # web is the single migrator: beat's DatabaseScheduler needs django_celery_beat's
    # tables to exist before it starts, and beat waits on web being healthy. Running
    # migrate from more than one service would race, since Django takes no lock.
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',
          timeout=3).status == 200 else 1)"
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s

  worker:
    <<: *app-service
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  beat:
    <<: *app-service
    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=INFO
      - --scheduler
      - django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
