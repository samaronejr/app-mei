# Production stack. STANDALONE — do not combine with docker-compose.yml.
#
# The dev file is a development stack (runserver, DEBUG=True, bind-mounted source,
# permissive password defaults). Layering an override on top of it would silently
# inherit those defaults wherever an override happened to be missing, and Compose's
# list-merge semantics make "remove the bind mount" hard to express. A separate file
# makes the production surface explicit and auditable in one read.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --wait
#
# Sizing note: this targets an Oracle E2.1.Micro (1 OCPU, 954 MiB RAM) plus a 4 GiB
# swapfile. Every limit below was measured on that box, not guessed. See ops/README.md.

x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: config.settings.prod
  # The image bakes the source at /app, and .env.prod is read by Compose (not Django).
  # Point Django's own env-file reader at a nonexistent path so configuration comes
  # only from the explicit values below — one source of truth, no shadowing.
  DJANGO_ENV_FILE: /nonexistent
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env.prod}
  DEBUG: "False"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
  # A wildcard here is rejected by the core.E003 system check: cookies are host-only
  # by design, so every tenant origin must be enumerated.
  #
  # `${VAR?}`, NOT `${VAR:?}` — the same distinction TLS_DIRECTIVE makes below, for the
  # same class of reason. The colon form rejects unset AND empty, but empty is this
  # variable's CORRECT production value: .env.prod.example ships `CSRF_TRUSTED_ORIGINS=`
  # and base.py defaults it to []. Every form in this product posts to the host that
  # served it, and Django accepts a same-origin POST by comparing Origin to the request
  # host without consulting this list at all. So with the colon, a correctly configured
  # .env.prod stops Compose before a single container starts, and the operator's only
  # route out is to invent a value that weakens CSRF — PILOT-403's shadow deploy failed
  # exactly here. Without the colon an ABSENT declaration still fails, which is the case
  # worth keeping: it means nobody ever decided whether cross-origin POSTs are allowed.
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS?CSRF_TRUSTED_ORIGINS must be declared in .env.prod, even if empty}
  # app_runtime holds neither SUPERUSER nor BYPASSRLS and owns no table. Pointing this
  # at the bootstrap superuser would make every RLS policy inert without erroring.
  DATABASE_URL: postgres://app_runtime:${APP_RUNTIME_PASSWORD:?}@db:5432/${POSTGRES_DB:-app_mei}
  DATABASE_MIGRATION_URL: postgres://app_migrator:${APP_MIGRATOR_PASSWORD:?}@db:5432/${POSTGRES_DB:-app_mei}
  CONN_MAX_AGE: ${CONN_MAX_AGE:-60}
  REDIS_URL: redis://redis:6379/0
  # EXACTLY ONE reverse proxy (caddy) terminates TLS in front of web. Setting this to 0
  # would collapse every client into a single rate-limit bucket, because X-Forwarded-For
  # would be ignored and every request would appear to originate from Caddy. Setting it
  # higher than the number of proxies WE control makes the client IP spoofable, which
  # would let an attacker evade the per-IP login limiter by forging the header.
  TRUSTED_PROXY_COUNT: "1"
  PLATFORM_URL: ${PLATFORM_URL:?PLATFORM_URL must be set}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-nao-responda@samaronefialho.dev}
  LGPD_ENCARREGADO_EMAIL: ${LGPD_ENCARREGADO_EMAIL:?LGPD art. 41 requires a named encarregado}
  # Provider-neutral SMTP transport. The three `:?` credentials make Compose stop
  # before container startup; core.E013 validates the rest together at Django boot.
  EMAIL_HOST: ${EMAIL_HOST:?EMAIL_HOST must be set in .env.prod}
  EMAIL_PORT: "${EMAIL_PORT:-587}"
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:?EMAIL_HOST_USER must be set in .env.prod}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:?EMAIL_HOST_PASSWORD must be set in .env.prod}
  EMAIL_USE_TLS: "${EMAIL_USE_TLS:-True}"
  EMAIL_USE_SSL: "${EMAIL_USE_SSL:-False}"
  EMAIL_TIMEOUT: "${EMAIL_TIMEOUT:-10}"
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
  # Object storage for portal documents (V4). These must be listed HERE, not merely
  # present in .env.prod: DJANGO_ENV_FILE points at /nonexistent so Django reads no env
  # file of its own, and Compose passes only what this block names. The `:?` forms make
  # Compose refuse to render before core.E011 would refuse to boot.
  OCI_S3_BUCKET: ${OCI_S3_BUCKET:?OCI_S3_BUCKET must be set in .env.prod}
  OCI_S3_REGION: ${OCI_S3_REGION:?OCI_S3_REGION must be set in .env.prod}
  OCI_S3_ENDPOINT_URL: ${OCI_S3_ENDPOINT_URL:?OCI_S3_ENDPOINT_URL must be set in .env.prod}
  OCI_S3_ACCESS_KEY_ID: ${OCI_S3_ACCESS_KEY_ID:?OCI_S3_ACCESS_KEY_ID must be set in .env.prod}
  OCI_S3_SECRET_ACCESS_KEY: ${OCI_S3_SECRET_ACCESS_KEY:?OCI_S3_SECRET_ACCESS_KEY must be set in .env.prod}

x-app-service: &app-service
  build:
    context: .
  image: app-mei:prod
  environment: *app-environment
  # No bind mount: the image is the artifact. A bind mount would let host state drift
  # from the built image and defeat rollback-by-tag.
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_mei}
      POSTGRES_USER: ${POSTGRES_USER:-app_mei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:?}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:?}
      APP_TEST_PASSWORD: ${APP_TEST_PASSWORD:?}
    # Tuned for 954 MiB total RAM. shared_buffers at the PostgreSQL default of 128 MB
    # plus 100 connection slots would alone exceed what this box can spare.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - max_connections=24
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      # Compressed, and every clause is load-bearing. Measured on this archive: a
      # timeout-forced segment is ~99.5% zero padding and gzips ~190x at -6, so the
      # 16 MiB written every 300 s becomes ~90 KiB. -6 rather than -1 (105x, 33 ms) or
      # -9 (198x, 83 ms): -6 buys most of the ratio for 46 ms and matches the
      # --compress=6 ops/backup.sh already passes to pg_basebackup and pg_dump.
      #
      #   test ! -f %f && test ! -f %f.gz  refuse to overwrite an existing segment in
      #     EITHER format. The first half is the stock PostgreSQL guard; the second is
      #     what stops a re-archive after the migration writing X.gz beside a plain X
      #     and leaving two candidate answers for the same segment.
      #   gzip -6 -c %p > %f.part          write under a name nothing reads. `.part` is
      #     29 chars, so IsXLogFileName() rejects it and neither pg_archivecleanup nor
      #     restore_command will ever mistake a partial write for a segment.
      #   && mv %f.part %f.gz              rename within one directory is atomic, so
      #     `%f.gz exists` implies `%f.gz is complete`. Without it a gzip killed
      #     mid-write leaves a truncated .gz that the guard above then treats as
      #     already-archived forever — a corrupt segment that never self-heals.
      #
      # NOT a pipeline. `cat %p | gzip -c > %f.gz` is the natural thing to write and it
      # is a data-loss bug: sh returns the LAST command's status, so a cat that cannot
      # read %p is invisible, gzip cheerfully writes a valid 20-byte archive of nothing,
      # archive_command exits 0, and PostgreSQL drops the .ready and recycles the WAL.
      # Rehearsed 2026-08-01: archived=2, failed=0, two segments gone, every signal
      # green — including backup.sh's own failed_count precondition.
      - archive_command=test ! -f /wal_archive/%f && test ! -f /wal_archive/%f.gz && gzip -6 -c %p > /wal_archive/%f.part && mv /wal_archive/%f.part /wal_archive/%f.gz
      - -c
      - archive_timeout=300
      - -c
      - max_wal_size=512MB
      - -c
      - min_wal_size=80MB
    # Docker creates a named-volume mount point owned by root, and a bind mount keeps the
    # host owner. Either way postgres (uid 999) cannot write, so archive_command fails on
    # EVERY segment — and PostgreSQL reports that only as a rising failed_count in
    # pg_stat_archiver, never as a startup error. The result is a server that looks
    # perfectly healthy while retaining zero WAL, i.e. silent, total loss of PITR.
    # Doing this in the entrypoint rather than by hand means it survives `down -v`.
    #
    # /backups is chowned RECURSIVELY and /wal_archive is not, and the asymmetry is the
    # lesson of the 2026-07-29 outage. /wal_archive is a named volume that only postgres
    # ever writes, so its contents cannot drift. /backups is a HOST bind mount whose
    # subdirectories the host does take back — and the non-recursive form here reached
    # only the mount point itself, leaving /backups/base and /backups/logical owned by
    # the ssh user. The backup then failed at its first mkdir while this line had "run".
    # Recursion is bounded by the retention policy (a handful of directories), not by
    # the WAL archive's thousands of segments, which is why only one side gets -R.
    entrypoint:
      - /bin/bash
      - -c
      - >-
        mkdir -p /wal_archive /backups
        && chown postgres:postgres /wal_archive
        && chown -R postgres:postgres /backups
        && chmod 775 /wal_archive /backups
        && exec /usr/local/bin/docker-entrypoint.sh "$$@"
      - --
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Entrypoint scripts run ONLY against an empty data directory. Changing roles.sql
      # therefore requires `down -v`, not a restart.
      - ./ops/sql:/docker-entrypoint-initdb.d:ro
      - wal_archive:/wal_archive
      - ./ops/backups:/backups
    # Loopback only. The database is never reachable from outside the host, and the
    # OCI Security List is NOT the control preventing it — this binding is.
    ports:
      - "127.0.0.1:5432:5432"
    # pg_isready alone returns success during the init phase, BEFORE the entrypoint has
    # run roles.sql. On a slow disk `web` could then start migrating against a cluster
    # with no app_migrator role. Asserting the role exists makes the healthcheck mean
    # what dependents actually rely on. (Closes the risk disclosed by the F3 cold-boot QA.)
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -q &&
          psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc
          "select count(*) from pg_roles where rolname in ('app_runtime','app_migrator')"
          | grep -qx 2
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    mem_limit: 320m
    restart: unless-stopped

  redis:
    image: redis:7
    # noeviction, deliberately: redis is the Celery broker here, and allkeys-lru would
    # silently discard queued tasks under pressure rather than failing loudly.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    mem_limit: 96m
    restart: unless-stopped

  web:
    <<: *app-service
    # web is the single migrator: beat's DatabaseScheduler needs django_celery_beat's
    # tables before it starts, and Django takes no lock, so migrating from more than one
    # service would race. collectstatic must precede gunicorn because prod.py uses
    # CompressedManifestStaticFilesStorage, which raises at request time if the manifest
    # is absent rather than degrading to unhashed paths.
    #
    # Everything before `manage.py check` runs --skip-checks, and the check then runs
    # exactly once, AFTER migrate. Django's management commands run their system checks
    # BEFORE their handler, so core.E012 — the portal-grant drift that migrate's own
    # post_migrate receiver is about to heal — would abort this command on a fresh
    # cluster and the healer would never execute. collectstatic checks only the
    # staticfiles tag and could not fire E012; it carries the flag for uniformity, so
    # that "nothing before the explicit check runs checks" is one rule, not a per-command
    # exception. The explicit check is this path's gate: a cluster that is still drifted
    # afterwards stops the container instead of reaching gunicorn.
    command:
      - sh
      - -c
      - >-
        python manage.py collectstatic --noinput --clear --skip-checks &&
        DATABASE_URL="$$DATABASE_MIGRATION_URL" python manage.py migrate --noinput
        --skip-checks &&
        python manage.py check &&
        exec gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers 2 --threads 2 --worker-class gthread
        --max-requests 400 --max-requests-jitter 40
        --timeout 60 --graceful-timeout 30
        --access-logfile - --error-logfile -
        --access-logformat 'remote=%(h)s time=%(t)s method=%(m)s status=%(s)s bytes=%(b)s duration=%(L)s user_agent="%(a)s"'
    expose:
      - "8000"
    # Both headers are load-bearing, and the dev healthcheck (which sends neither) CANNOT
    # work here:
    #   Host             - the loopback probe would otherwise arrive as `127.0.0.1:8000`,
    #                      which is absent from ALLOWED_HOSTS, and Django answers 400.
    #   X-Forwarded-Proto - prod.py sets SECURE_SSL_REDIRECT=True, so without it Django
    #                      301s the probe to https:// and the check fails on TLS, not on
    #                      application health.
    # The host is derived from ALLOWED_HOSTS rather than duplicated, so it cannot drift.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,sys,urllib.request;
          h=[x.strip().lstrip('.') for x in os.environ['ALLOWED_HOSTS'].split(',') if x.strip()][0];
          r=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/healthz',
          headers={'Host':h,'X-Forwarded-Proto':'https'}),timeout=5);
          sys.exit(0 if r.status==200 else 1)"
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 40s
    mem_limit: 400m

  worker:
    <<: *app-service
    # concurrency=1 and a child recycle: on 1 OCPU more concurrency buys nothing but
    # RAM, and max-tasks-per-child bounds leak accumulation on a box with no headroom.
    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=INFO
      - --concurrency=1
      - --prefetch-multiplier=1
      - --max-tasks-per-child=100
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 15s
      timeout: 15s
      retries: 12
      start_period: 45s
    mem_limit: 320m

  beat:
    <<: *app-service
    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=INFO
      - --scheduler
      - django_celery_beat.schedulers:DatabaseScheduler
    # Without this, `up --wait` cannot fail on a crash-looping scheduler, and the only
    # signal that beat died is the 15-minute dead-man's switch flipping /healthz to 503.
    # This is liveness only — it proves the process exists, NOT that it is scheduling.
    # The heartbeat in /healthz remains the authority on whether ticks are happening.
    # (Closes the second risk disclosed by the F3 cold-boot QA.)
    # Reads /proc directly because python:3.13-slim ships no procps, so pgrep does not
    # exist and the check would fail permanently while beat was perfectly healthy.
    healthcheck:
      test: ["CMD-SHELL", "grep -qa beat /proc/1/cmdline"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 45s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    mem_limit: 256m

  caddy:
    # Built, not pulled: the stock image has no DNS provider module, and a wildcard
    # certificate can only be issued over DNS-01. See ops/caddy/Dockerfile.
    build:
      context: ./ops/caddy
    # Named explicitly because a build-only service takes a tag derived from the Compose
    # project name, which is the directory name — `app_mei-caddy` here, `app-mei-caddy`
    # on the box, whatever the runner's checkout path yields in CI. CI builds this image
    # by tag and ships it by tag, so the derived name would not be the name `up -d
    # --no-build` then looks for. It is also what the rollback tag attaches to.
    image: app-mei-caddy:prod
    # Terminates TLS and sets X-Forwarded-Proto, which prod.py's SECURE_PROXY_SSL_HEADER
    # requires. Without a proxy setting that header, SECURE_SSL_REDIRECT=True produces
    # an infinite redirect loop rather than an error.
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # SITE_ADDRESS must name BOTH the wildcard and the apex, comma-separated:
      #   *.samaronefialho.dev, samaronefialho.dev
      # The wildcard covers every firm host `<slug>.<domain>` AND every portal host
      # `<slug>-portal.<domain>`, because `acme-portal` is a single DNS label. That is
      # the whole reason the portal host is `<slug>-portal.<domain>` and not
      # `portal.<slug>.<domain>`: the latter is two labels, and no public CA issues
      # `*.*.<domain>`.
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS must be set}
      # TLS is two variables, not one, because the Caddyfile grammar forbids a `{` with
      # content after it on the same line — so the DNS challenge cannot be injected as a
      # one-line `tls { ... }`. Staging sets TLS_DIRECTIVE and leaves ACME_DNS_OPTION
      # empty; production does the reverse. ops/Caddyfile documents the pair.
      # `${VAR-default}`, NOT `${VAR:-default}`. The colon form substitutes when the
      # variable is unset OR EMPTY, so production's deliberate `TLS_DIRECTIVE=` would
      # silently become `tls internal` — Caddy's self-signed CA, every browser warning,
      # and ACME_DNS_OPTION ignored, on a deployment that looks correctly configured.
      # Without the colon, an explicit empty value stays empty and only an absent
      # variable falls back.
      TLS_DIRECTIVE: ${TLS_DIRECTIVE-tls internal}
      ACME_DNS_OPTION: ${ACME_DNS_OPTION-}
      # Required whenever ACME_DNS_OPTION selects the cloudflare challenge. Scope the
      # token to Zone -> DNS -> Edit on this zone only: DNS-01 writes a _acme-challenge
      # TXT record and needs nothing else.
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      web:
        condition: service_healthy
    # Targets Caddy's own :8080 responder, NOT the proxied site: a loopback request to
    # the real site arrives as `Host: 127.0.0.1`, which Django rejects with 400 because
    # it is absent from ALLOWED_HOSTS. Django's health is asserted by `web` already;
    # this check answers only "is Caddy serving?".
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    mem_limit: 96m
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  wal_archive:
  caddy_data:
  caddy_config:
